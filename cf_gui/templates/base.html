<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}cf-gui{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">cf-gui <span>●</span></a>
    {% if session.get('admin') %}
    <nav class="primary-nav" aria-label="Nawigacja główna">
      <a href="{{ url_for('index') }}">Ingress</a>
      <a href="{{ url_for('service') }}">Usługa</a>
    </nav>
    <form method="post" action="{{ url_for('logout') }}" class="logout-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="link-button" type="submit">Wyloguj</button>
    </form>
    {% endif %}
  </header>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="notice {{ category }}" role="{{ 'status' if category in ('success', 'info') else 'alert' }}"{% if category in ('success', 'info') %} data-auto-dismiss{% endif %}>{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script>
    document.querySelectorAll('[data-auto-dismiss]').forEach((notice) => {
      window.setTimeout(() => {
        notice.classList.add('is-dismissing');
        window.setTimeout(() => notice.remove(), 300);
      }, 4000);
    });
  </script>
</body>
</html>
